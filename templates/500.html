{% extends "base.html" %}

{% block title %}Internal Server Error | CareBridge{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 3rem auto; text-align: center; padding: 2.5rem 1.5rem;">
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">⚠️ 500</div>
    <h2 style="color: var(--card-title-color); margin-bottom: 0.75rem;">System Error</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
        An unexpected error occurred while processing your request. Please try again or return to the main dashboard.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Safety (Home)</a>
</div>
{% endblock %}
